<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Sign In</title>
</head>
<body>
  <div class="auth-shell">
    <aside class="brand-panel">
      <a class="brand-mark" href="/signin"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 14.5l3.5 3.5L19 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Workspace</span></a>
      <p class="brand-statement">One account for everything you do here.</p>
      <p class="brand-foot">Secured by Firebase Authentication</p>
    </aside>
    <main class="form-area">
      <div class="form-card">
        <a class="brand-mark" href="/signin"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 14.5l3.5 3.5L19 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Workspace</span></a>
        <h1 class="form-title">Sign in</h1>
        <p class="form-subtitle">Enter your email and password to continue.</p>

        <form id="signin-form" novalidate>
          <div class="form-alert" aria-live="polite"></div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error">
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
            <p class="field-error" id="password-error"></p>
          </div>

          <button class="btn btn-primary" type="submit">Sign In</button>
        </form>

        <p class="switch-link">Don't have an account? <a href="/signup">Create Account</a></p>
      </div>
    </main>
  </div>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
