<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8FB" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="robots" content="noindex" />
    <title>Your account | Taxora</title>
  </head>
  <body class="app">
    <div class="dash" data-page hidden>
      <header class="topbar">
        <a class="logo" href="/" aria-label="Taxora home">
          <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0F1E45"/><path d="M9 10.5h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M16 10.5V23" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="23" cy="21.5" r="2.3" fill="#22C3D6"/></svg>
          <span>Taxora</span>
        </a>
        <button type="button" class="btn btn-ghost" id="signout" data-busy-label="Signing out" data-done-label="Signed out"><span class="btn-text">Sign out</span><span class="btn-spinner" aria-hidden="true"></span><svg class="btn-check" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 7"/></svg></button>
      </header>
      <main class="dash-main">
        <div class="card card-wide">
          <h1 id="welcome">Welcome</h1>
          <p class="lede">You’re signed in. Here are your account details.</p>

          <div class="notice" id="verify-notice" hidden>
            <p>Confirm your email address. We sent a link to <strong id="verify-email"></strong>.</p>
            <div class="notice-actions">
              <button type="button" class="btn btn-small" id="verify-check" data-busy-label="Checking"><span class="btn-text">I’ve confirmed it</span><span class="btn-spinner" aria-hidden="true"></span><svg class="btn-check" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 7"/></svg></button>
              <button type="button" class="link" id="verify-resend">Resend email</button>
            </div>
          </div>
          <div class="alert" id="dash-alert" role="status" hidden></div>

          <dl class="details">
            <div><dt>Name</dt><dd id="d-name">—</dd></div>
            <div><dt>Email</dt><dd id="d-email">—</dd></div>
            <div><dt>Email status</dt><dd id="d-verified">—</dd></div>
            <div><dt>Member since</dt><dd id="d-created">—</dd></div>
            <div><dt>Last sign-in</dt><dd id="d-last">—</dd></div>
          </dl>
        </div>
      </main>
    </div>
    <noscript><p class="noscript">Taxora needs JavaScript to show your account.</p></noscript>
    <script type="module" src="/src/pages/dashboard.js"></script>
  </body>
</html>
