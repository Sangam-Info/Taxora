<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B2550" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="description" content="Create your Taxora account." />
    <title>Create account | Taxora</title>
  </head>
  <body>
    <div class="auth" data-page hidden>
      <aside class="brand">
        <a class="wordmark" href="/">Taxora</a>
        <p class="brand-line">Books, GST and bank statements, kept in one ledger.</p>
        <p class="brand-foot">A Sangam InfoAnalytics product</p>
      </aside>
      <main class="sheet">
        <div class="form-wrap">
          <h1>Create your account</h1>
          <p class="lede">It takes a minute. You’ll use this email to sign in.</p>
          <div class="alert" id="signup-alert" role="alert" hidden></div>
          <form id="signup-form" novalidate>
            <div class="field">
              <label for="su-name">Full name</label>
              <input id="su-name" name="fullName" type="text" autocomplete="name" maxlength="80" required aria-describedby="su-name-error" />
              <p class="field-error" id="su-name-error"></p>
            </div>
            <div class="field">
              <label for="su-email">Email</label>
              <input id="su-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" required aria-describedby="su-email-error" />
              <p class="field-error" id="su-email-error"></p>
            </div>
            <div class="field">
              <label for="su-password">Password</label>
              <div class="password">
                <input id="su-password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="su-password-error su-password-rules" />
                <button type="button" class="reveal" aria-controls="su-password" aria-pressed="false" aria-label="Show password">Show</button>
              </div>
              <ul class="rules" id="su-password-rules">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="letter">A letter</li>
                <li data-rule="number">A number</li>
              </ul>
              <p class="field-error" id="su-password-error"></p>
            </div>
            <div class="field">
              <label for="su-confirm">Confirm password</label>
              <div class="password">
                <input id="su-confirm" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="su-confirm-error" />
                <button type="button" class="reveal" aria-controls="su-confirm" aria-pressed="false" aria-label="Show password">Show</button>
              </div>
              <p class="field-error" id="su-confirm-error"></p>
            </div>
            <button class="btn" type="submit" data-busy-label="Creating account…">Create account</button>
          </form>
          <p class="switch">Already have an account? <a href="/">Sign in</a></p>
        </div>
      </main>
    </div>
    <noscript><p class="noscript">Taxora needs JavaScript to create your account.</p></noscript>
    <script type="module" src="/src/pages/signup.js"></script>
  </body>
</html>
